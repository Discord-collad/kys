# Perfil de TEST: H2 en memoria (PostgreSQL mode) + esquema generado por Hibernate.
# migration.sql NO corre aqui (usa DELETE ... USING de PostgreSQL); el esquema sale de las entidades,
# que ya declaran la unique (usuario_id, fecha) en Asistencia.
spring.datasource.url=jdbc:h2:mem:kystest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never
