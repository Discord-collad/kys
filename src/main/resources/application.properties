# === PostgreSQL Config (todo externalizable via env vars en Render) ===
# Local dev: apunta a localhost:5432/Mio.1
# Render prod: SPRING_DATASOURCE_URL se inyecta automáticamente desde render.yaml
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/Mio.1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:12345678}
spring.datasource.driver-class-name=org.postgresql.Driver

# === JPA Settings ===
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
# En local se ejecuta siempre; en prod se apaga (SPRING_SQL_INIT_MODE=never) porque
# restauramos la DB con pg_restore antes de levantar la app
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
spring.sql.init.schema-locations=classpath:db/migration.sql
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# === Server ===
server.port=${PORT:8080}
server.address=0.0.0.0
server.forward-headers-strategy=framework
# Pool Hikari unico (se elimino duplicado maximum-pool-size)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=30000
server.servlet.session.timeout=15m
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# === Cabeceras HTTP (si us\u00e1s Spring Security)
# Agreg\u00e1 en SecurityConfig.java para m\u00e1s protecci\u00f3n

# === Logging (opcional en producci\u00f3n)
