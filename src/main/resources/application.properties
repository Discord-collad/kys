# PostgreSQL Config
spring.datasource.url=${SPRING_DATASOURCE_URL:
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
spring.sql.init.schema-locations=classpath:db/migration.sql
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=${SERVER_PORT:${PORT:8080}}
server.address=${SERVER_ADDRESS:0.0.0.0}
server.forward-headers-strategy=framework

# Hikari
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:1}
spring.datasource.hikari.idle-timeout=${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:30000}
spring.datasource.hikari.max-lifetime=${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:60000}
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}
server.servlet.session.timeout=${SERVER_SERVLET_SESSION_TIMEOUT:15m}
server.servlet.encoding.charset=${SERVER_SERVLET_ENCODING_CHARSET:UTF-8}
server.servlet.encoding.enabled=${SERVER_SERVLET_ENCODING_ENABLED:true}
server.servlet.encoding.force=${SERVER_SERVLET_ENCODING_FORCE:true}
