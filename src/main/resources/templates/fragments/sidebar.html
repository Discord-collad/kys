<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Fragmentos de navegación KYS</title>
</head>
<body>

<!-- ============================================================
     FRAGMENT: sidebar(activo)
     Uso: <th:block th:replace="~{fragments/sidebar :: sidebar('inicio')}"></th:block>
     'activo' = clave de la sección actual: inicio | usuarios | cursos | horarios |
                asistencias | asignar-horario | asignar-curso | historial | horario
     Depende de los atributos globales de GlobalModelAdvice:
     rolActual, homeUrl, nombreParaMostrar, inicialUsuario
     ============================================================ -->
<th:block th:fragment="sidebar(activo)">

    <aside class="sidebar" id="sidebar" aria-label="Menú lateral de navegación">
        <div class="sidebar-brand">
            <a th:href="${homeUrl}" class="sidebar-logo" aria-label="KYS - Ir al inicio">KYS</a>
            <span class="nav-text sidebar-brand-txt">
                <strong>KYS</strong>
                <small>Sistema de asistencia</small>
            </span>
        </div>

        <nav class="sidebar-nav" aria-label="Navegación principal">
            <!-- ============ DIRECTOR ============ -->
            <th:block th:if="${rolActual == 'DIRECTOR'}">
                <a th:href="@{/admin}" class="side-link" title="Inicio"
                   th:classappend="${activo == 'inicio'} ? 'active'">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    <span class="nav-text">Inicio</span>
                </a>
                <a th:href="@{/admin/usuarios}" class="side-link" title="Usuarios"
                   th:classappend="${activo == 'usuarios'} ? 'active'">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    <span class="nav-text">Usuarios</span>
                </a>
                <a th:href="@{/admin/cursos}" class="side-link" title="Cursos"
                   th:classappend="${activo == 'cursos'} ? 'active'">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                    <span class="nav-text">Cursos</span>
                </a>
                <a th:href="@{/admin/horarios}" class="side-link" title="Horarios"
                   th:classappend="${activo == 'horarios'} ? 'active'">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    <span class="nav-text">Horarios</span>
                </a>
                <a th:href="@{/admin/asistencias}" class="side-link" title="Asistencias"
                   th:classappend="${activo == 'asistencias'} ? 'active'">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><polyline points="9 13 11 15 15 11"/></svg>
                    <span class="nav-text">Asistencias</span>
                </a>
                <a th:href="@{/admin/configuracion}" class="side-link" title="Configuración"
                   th:classappend="${activo == 'configuracion'} ? 'active'">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    <span class="nav-text">Configuración</span>
                </a>
                <span class="side-seccion nav-text">Asignaciones</span>
                <a th:href="@{/admin/horarios/asignar}" class="side-link" title="Asignar horario"
                   th:classappend="${activo == 'asignar-horario'} ? 'active'">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
                    <span class="nav-text">Asignar horario</span>
                </a>
                <a th:href="@{/admin/cursos/asignar}" class="side-link" title="Asignar curso"
                   th:classappend="${activo == 'asignar-curso'} ? 'active'">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
                    <span class="nav-text">Asignar curso</span>
                </a>
            </th:block>

            <!-- ============ PROFESOR ============ -->
            <th:block th:if="${rolActual == 'PROFESOR'}">
                <a th:href="@{/profesor}" class="side-link" title="Inicio"
                   th:classappend="${activo == 'inicio'} ? 'active'">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    <span class="nav-text">Inicio</span>
                </a>
                <a th:href="@{/profesor/asistencias}" class="side-link" title="Historial de asistencias"
                   th:classappend="${activo == 'asistencias'} ? 'active'">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                    <span class="nav-text">Historial</span>
                </a>
            </th:block>

            <!-- ============ ALUMNO ============ -->
            <th:block th:if="${rolActual == 'ALUMNO'}">
                <a th:href="@{/alumno}" class="side-link" title="Inicio"
                   th:classappend="${activo == 'inicio'} ? 'active'">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    <span class="nav-text">Inicio</span>
                </a>
                <a th:href="@{/alumno/historial}" class="side-link" title="Historial"
                   th:classappend="${activo == 'historial'} ? 'active'">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                    <span class="nav-text">Historial</span>
                </a>
                <a th:href="@{/alumno/horario}" class="side-link" title="Mi horario"
                   th:classappend="${activo == 'horario'} ? 'active'">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    <span class="nav-text">Mi horario</span>
                </a>
            </th:block>

            <!-- Respaldo: usuario autenticado sin rol reconocido -->
            <th:block th:if="${rolActual == null or rolActual == ''}">
                <a th:href="${homeUrl}" class="side-link" title="Inicio">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    <span class="nav-text">Inicio</span>
                </a>
            </th:block>
        </nav>

        <div class="sidebar-footer">
            <div class="sidebar-user">
                <span class="avatar" th:text="${inicialUsuario}">U</span>
                <span class="nav-text sidebar-user-info">
                    <strong th:text="${nombreParaMostrar}">Usuario</strong>
                    <small th:text="${rolActual}">ROL</small>
                </span>
            </div>
            <!-- [P0] Logout por POST con token CSRF (Spring Security 6 rechaza GET /logout con CSRF activo) -->
            <form th:action="@{/logout}" method="post" class="side-form-logout">
                <button type="submit" class="side-link side-salir side-logout-btn" title="Cerrar sesión">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    <span class="nav-text">Cerrar sesión</span>
                </button>
            </form>
        </div>
    </aside>

    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <header class="topbar">
        <button class="hamburger" id="hamburgerBtn" aria-label="Abrir o cerrar el menú"
                aria-controls="sidebar" aria-expanded="true">
            <span></span><span></span><span></span>
        </button>
        <a th:href="${homeUrl}" class="topbar-logo" aria-label="KYS - Ir al inicio">KYS</a>
        <nav class="breadcrumb" aria-label="Ruta actual">
            <a th:href="${homeUrl}">Inicio</a>
            <span class="crumb-sep" aria-hidden="true">/</span>
            <span th:text="${subtitulo}">Página</span>
        </nav>
        <div class="topbar-user">
            <span class="avatar" th:text="${inicialUsuario}">U</span>
            <div class="topbar-user-info">
                <strong th:text="${nombreParaMostrar}">Usuario</strong>
                <small th:text="${rolActual}">ROL</small>
            </div>
        </div>
    </header>

</th:block>

</body>
</html>
