<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial · Profesor</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="app-body">
    <th:block th:replace="~{fragments/sidebar :: sidebar('asistencias')}"></th:block>

    <main class="container">
        <div th:if="${error}" class="alerta alerta-error" th:text="${error}"></div>

        <section class="card">
            <form method="get" th:action="@{/profesor/asistencias}"
                  style="display:flex; gap:12px; align-items:end; flex-wrap:wrap;">
                <div class="form-group" style="margin-bottom:0;">
                    <label>Desde</label>
                    <input type="date" name="desde" th:value="${desde}" />
                </div>
                <div class="form-group" style="margin-bottom:0;">
                    <label>Hasta</label>
                    <input type="date" name="hasta" th:value="${hasta}" />
                </div>
                <button type="submit" class="btn btn-primario">Filtrar</button>
                <a th:href="@{/profesor/asistencias/csv(desde=${desde},hasta=${hasta})}" class="btn btn-suave" title="Descargar CSV del rango mostrado">⬇ Exportar CSV</a>
            </form>
        </section>

        <section class="card">
            <div class="tabla-wrap">
                <table>
                    <thead>
                        <tr><th>Alumno</th><th>Fecha</th><th>Entrada</th><th>Salida</th><th>Estado</th><th>Validado por</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="a : ${asistencias}">
                            <td th:text="${a.usuario.nombre + ' ' + a.usuario.apellido}"></td>
                            <td th:text="${#temporals.format(a.fecha, 'dd/MM/yyyy')}"></td>
                            <td th:text="${a.horaEntrada != null} ? ${#temporals.format(a.horaEntrada, 'HH:mm')} : '---'"></td>
                            <td th:text="${a.horaSalida != null} ? ${#temporals.format(a.horaSalida, 'HH:mm')} : '---'"></td>
                            <td>
                                <span class="badge"
                                      th:classappend="${a.estadoAsistencia == 'APROBADO'} ? 'badge-verde' : (${a.estadoAsistencia == 'RECHAZADO'} ? 'badge-rojo' : 'badge-ambar')"
                                      th:text="${a.estadoAsistencia}"></span>
                            </td>
                            <td th:text="${a.validadoPor != null ? a.validadoPor.nombre + ' ' + a.validadoPor.apellido : '---'}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script th:src="@{/js/sidebar.js}" defer></script>
</body>
</html>
