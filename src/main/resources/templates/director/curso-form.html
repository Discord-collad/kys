<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curso · Dirección</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="app-body">
    <th:block th:replace="~{fragments/sidebar :: sidebar('cursos')}"></th:block>

    <main class="container" style="max-width:560px;">
        <section class="card">
            <div class="card-head"><h2>Datos del curso</h2></div>
            <form th:action="@{/admin/cursos/guardar}" method="post" th:object="${curso}">
                <input type="hidden" th:field="*{id}" th:if="${curso.id != null}" />
                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" th:field="*{nombre}" required placeholder="Ej: 1° Año A" />
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Turno</label>
                        <select th:field="*{turno}">
                            <option value="Mañana">Mañana</option>
                            <option value="Tarde">Tarde</option>
                            <option value="Noche">Noche</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Año</label>
                        <input type="text" th:field="*{anio}" placeholder="2026" />
                    </div>
                </div>
                <div class="acciones-form">
                    <button type="submit" class="btn btn-primario">Guardar</button>
                    <a href="/admin/cursos" class="btn btn-suave">Cancelar</a>
                </div>
            </form>
        </section>
    </main>

    <script th:src="@{/js/sidebar.js}" defer></script>
</body>
</html>
