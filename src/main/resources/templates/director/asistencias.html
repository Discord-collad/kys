<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistencias · Dirección</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="app-body">
    <th:block th:replace="~{fragments/sidebar :: sidebar('asistencias')}"></th:block>

    <main class="container">
        <div th:if="${mensaje}" class="alerta alerta-ok" th:text="${mensaje}"></div>

        <section class="card">
            <div class="card-head"><h2>Registrar entrada manual</h2></div>
            <form th:action="@{/admin/asistencias/registrar}" method="post"
                  style="display:flex; gap:14px; align-items:end; flex-wrap:wrap;">
                <div class="form-group" style="flex:1; min-width:260px; margin-bottom:0;">
                    <label>Usuario</label>
                    <select name="usuarioId" required>
                        <option value="">Elegí un usuario…</option>
                        <option th:each="u : ${usuarios}"
                                th:value="${u.id}"
                                th:text="${u.nombre + ' ' + u.apellido + ' (' + u.username + ')'}"></option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primario">Registrar entrada</button>
            </form>
        </section>

        <section class="card">
            <div class="card-head">
                <h2>Historial</h2>
                <a th:href="@{/admin/asistencias/csv}" class="btn btn-suave btn-sm" title="Descargar todo el historial en CSV">⬇ Exportar CSV</a>
            </div>
            <div class="tabla-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Usuario</th>
                            <th>Fecha</th>
                            <th>Entrada</th>
                            <th>Salida</th>
                            <th>Estado</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="a : ${asistencias}">
                            <td th:text="${a.id}"></td>
                            <td th:text="${a.usuario.nombre + ' ' + a.usuario.apellido}"></td>
                            <td th:text="${#temporals.format(a.fecha, 'dd/MM/yyyy')}"></td>
                            <td th:text="${a.horaEntrada != null} ? ${#temporals.format(a.horaEntrada, 'HH:mm')} : '---'"></td>
                            <td th:text="${a.horaSalida != null} ? ${#temporals.format(a.horaSalida, 'HH:mm')} : '---'"></td>
                            <td>
                                <span class="badge"
                                      th:classappend="${a.estadoAsistencia == 'APROBADO'} ? 'badge-verde' : (${a.estadoAsistencia == 'RECHAZADO'} ? 'badge-rojo' : 'badge-ambar')"
                                      th:text="${a.estadoAsistencia}"></span>
                            </td>
                            <td>
                                <form th:if="${a.horaSalida == null}"
                                      th:action="@{/admin/asistencias/salida/{id}(id=${a.id})}" method="post" style="display:inline;">
                                    <button type="submit" class="btn btn-exito btn-sm">Registrar salida</button>
                                </form>
                                <span th:unless="${a.horaSalida == null}" class="badge badge-teal">Completa</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script th:src="@{/js/sidebar.js}" defer></script>
</body>
</html>
