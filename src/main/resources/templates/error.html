<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error · KYS</title>
    <style>
        /* Página autocontenida: no depende de recursos estáticos para poder mostrarse siempre */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 45%, #5b21b6 100%);
            padding: 20px;
        }
        .tarjeta {
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, .97);
            border-radius: 26px;
            padding: 44px 40px 36px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, .4);
            text-align: center;
        }
        .icono {
            width: 74px; height: 74px;
            margin: 0 auto 18px;
            border-radius: 22px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 12px 28px rgba(99, 102, 241, .45);
        }
        .icono svg { width: 38px; height: 38px; color: #fff; }
        h1 { font-size: 25px; color: #0f172a; letter-spacing: -.02em; margin-bottom: 8px; }
        .codigo {
            display: inline-block;
            background: #eef2ff;
            color: #4338ca;
            font-weight: 700;
            font-size: 13px;
            padding: 4px 12px;
            border-radius: 999px;
            margin-bottom: 14px;
        }
        p { color: #64748b; font-size: 14.5px; margin-bottom: 26px; line-height: 1.5; }
        .acciones { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .btn {
            display: inline-block;
            padding: 12px 26px;
            border-radius: 13px;
            font-size: 14.5px;
            font-weight: 700;
            text-decoration: none;
            transition: transform .18s, box-shadow .18s;
        }
        .btn-primario {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            box-shadow: 0 10px 24px rgba(99, 102, 241, .4);
        }
        .btn-suave { background: #eef2ff; color: #4338ca; }
        .btn:hover { transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="tarjeta">
        <div class="icono">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
        </div>
        <h1>Ups, algo salió mal</h1>
        <div class="codigo" th:text="${codigoError} != null ? 'Error ' + ${codigoError} : 'Error'">Error</div>
        <p th:text="${mensajeError} != null ? ${mensajeError} : 'Ocurrió un problema inesperado. Probá nuevamente en unos momentos.'">
            Ocurrió un problema inesperado.
        </p>
        <div class="acciones">
            <a th:href="${homeUrl} != null ? ${homeUrl} : '/'" class="btn btn-primario">Volver al inicio</a>
            <a href="javascript:history.back()" class="btn btn-suave">Volver atrás</a>
        </div>
    </div>
</body>
</html>
