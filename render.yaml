services:
  # ---------- App ----------
  - type: web
    name: kys
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /login
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Armamos la URL JDBC con componentes (workaround: connectionString en Render
      # viene sin dominio regional ni puerto y rompe el driver).
      # Los nombres DB_HOST / DB_PORT / DB_NAME matchean con application.properties.
      - key: DB_HOST
        fromDatabase:
          name: kys-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: kys-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: kys-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: kys-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: kys-db
          property: password
      # En prod NO corremos migration.sql: los datos se restauran con pg_restore
      - key: SPRING_SQL_INIT_MODE
        value: never

  # ---------- DB ----------
  - type: postgres
    name: kys-db
    plan: free
    region: oregon
    databaseName: kys
    user: kys
    ipAllowList: []  # solo internas; para restaurar se permite temporalmente